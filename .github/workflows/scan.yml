name: Prijzen ophalen

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      trip_type:
        description: "round_trip of one_way"
        default: "round_trip"
      out_date:
        description: "Heendatum YYYY-MM-DD (leeg = settings.json)"
        default: ""
      ret_date:
        description: "Terugdatum YYYY-MM-DD (leeg bij enkele reis)"
        default: ""
      flex_days:
        description: "Speling in dagen (0-7)"
        default: "3"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Scrapling installeren
        run: pip install -r requirements.txt && pip show scrapling | head -2

      - name: Browsers uit cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/camoufox
            ~/.cache/patchright
          key: browsers-${{ runner.os }}-v1

      - name: Browser installeren
        run: scrapling install

      - name: Instellingen bepalen
        id: cfg
        run: |
          if [ -n "${{ inputs.out_date }}" ]; then
            echo "type=${{ inputs.trip_type }}" >> $GITHUB_OUTPUT
            echo "out=${{ inputs.out_date }}" >> $GITHUB_OUTPUT
            echo "ret=${{ inputs.ret_date }}" >> $GITHUB_OUTPUT
            echo "flex=${{ inputs.flex_days }}" >> $GITHUB_OUTPUT
          else
            echo "type=$(jq -r .trip_type settings.json)" >> $GITHUB_OUTPUT
            echo "out=$(jq -r .out_date settings.json)" >> $GITHUB_OUTPUT
            echo "ret=$(jq -r '.ret_date // ""' settings.json)" >> $GITHUB_OUTPUT
            echo "flex=$(jq -r '.flex_days // 3' settings.json)" >> $GITHUB_OUTPUT
          fi

      - name: Virtueel scherm (voor KLM)
        run: sudo apt-get install -y -qq xvfb > /dev/null

      - name: Vluchten ophalen
        env:
          HEADFUL: "1"
        run: >
          xvfb-run -a --server-args="-screen 0 1920x1080x24"
          python scan.py
          --type "${{ steps.cfg.outputs.type }}"
          --out "${{ steps.cfg.outputs.out }}"
          --ret "${{ steps.cfg.outputs.ret }}"
          --flex "${{ steps.cfg.outputs.flex }}"

      - name: Debug-pagina's bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
          retention-days: 3

      - name: Resultaat opslaan in repo
        if: always()
        run: |
          [ -f results/latest.json ] || exit 0
          git config user.name "prijswacht-bot"
          git config user.email "prijswacht-bot@users.noreply.github.com"
          git add results/latest.json
          git commit -m "Prijzen $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
          git push
