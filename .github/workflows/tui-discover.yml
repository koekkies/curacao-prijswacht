name: TUI verkennen

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script om te draaien"
        default: "tui_discover.py"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/camoufox
            ~/.cache/patchright
          key: browsers-${{ runner.os }}-v1
      - run: scrapling install
      - run: python "${{ inputs.script }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tui_debug
          path: results/tui_debug/
          retention-days: 3
