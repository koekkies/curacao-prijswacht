name: TUI verkennen

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script om te draaien"
        default: "tui_discover.py"
      candidates:
        description: "JSON met naam->url"
        default: ""

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/camoufox
            ~/.cache/patchright
          key: browsers-${{ runner.os }}-v1
      - run: scrapling install
      - run: sudo apt-get install -y -qq xvfb > /dev/null
      - run: xvfb-run -a --server-args="-screen 0 1920x1080x24" python "${{ inputs.script }}"
        env:
          CANDIDATES: ${{ inputs.candidates }}
          WAIT_MS: "30000"
          CLICK: "Zoeken|Vluchten zoeken|Zoek"
          HEADFUL: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tui_debug
          path: results/tui_debug/
          retention-days: 3
      - name: Debug naar tak tui-debug
        if: always()
        run: |
          [ -d results/tui_debug ] || exit 0
          git config user.name "prijswacht-bot"
          git config user.email "prijswacht-bot@users.noreply.github.com"
          git checkout --orphan tui-debug
          git rm -rq --cached . || true
          git add -f results/tui_debug
          git commit -qm "TUI debug $(date -u +%H:%M)"
          git push -fq origin tui-debug
